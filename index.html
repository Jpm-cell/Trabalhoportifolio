<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App tarefas</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}


.app {
    width: 320px;
    height: 580px;
    background-color: white;
    border-radius: 25px;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
    overflow: hidden;
}


.header {
    background-color: #09dfee;
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 20px;
    font-weight: bold;
}


.content {
    padding: 20px;
    text-align: center;
}


.content p {
    font-size: 16px;
    margin: 20px 0;
}


button {
    background-color: #0d6dad;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 20px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #08a4c7;
}


.footer {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: gray;
}
</style>
</head>
<body>

<div class="app">
    <div class="header">APP tarefas</div>

    <div class="content">
        <h3></h3>
        <p>
            Criar nova tarefa
        </p>
        <button onclick="alert('nova tarefa criada! ✅')">
        Criar
        </button>
    </div>

    <div class="footer">
        Projeto Se Liga - App Mobile
    </div>
</div>

</body>
</html>
